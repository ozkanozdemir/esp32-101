; ESP32-S3-DevKitC-1 N16R8 (16 MB QIO Flash + 8 MB OPI PSRAM)

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash + PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Site dosyaları data/ klasöründen yüklenir: pio run -t uploadfs
board_build.filesystem = littlefs

; Derlenecek kaynak dosyalar: src/ içindeki her şey, main.cpp hariç.
; main2.cpp eski sürümdür (kart kendi Wi-Fi ağını yayınlar), şu an o çalışıyor.
; Modeme bağlanan sürüme (main.cpp) dönmek için:
;   build_src_filter = +<*> -<main2.cpp>
build_src_filter = +<*> -<main.cpp>

; Web sunucusu + WebSocket (aynı 80. port) ve JSON
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; Monitör açılınca kart yükleme moduna düşmesin (USB-Serial/JTAG + macOS)
monitor_dtr = 1
monitor_rts = 0
monitor_filters = esp32_exception_decoder
